name: Deploy Backend

on:
  push:
    branches: [main]
    paths: [backend/**, reference_data/**]

env:
  GCP_PROJECT: regagent-dora-2026
  GCP_REGION: europe-west9
  AR_REPO: regagent-repo
  SERVICE_NAME: regagent-backend
  IMAGE: europe-west9-docker.pkg.dev/regagent-dora-2026/regagent-repo/backend

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/85716527673/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@regagent-dora-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -f backend/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --service-account=regagent-runtime-sa@regagent-dora-2026.iam.gserviceaccount.com \
            --set-env-vars="GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }},DOCAI_PROCESSOR_ID=9a4312989d6fb591" \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --quiet
