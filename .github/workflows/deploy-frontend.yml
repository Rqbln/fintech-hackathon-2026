name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**]

env:
  GCP_PROJECT: regagent-dora-2026
  GCP_REGION: europe-west9
  SERVICE_NAME: regagent-frontend
  IMAGE: europe-west9-docker.pkg.dev/regagent-dora-2026/regagent-repo/frontend

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/85716527673/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@regagent-dora-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest frontend/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="BACKEND_URL=https://regagent-backend-u7g4prc4ba-od.a.run.app" \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --quiet
