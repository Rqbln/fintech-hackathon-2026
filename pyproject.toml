[project]
name = "dora-analyst"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
    # Config & logging
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "structlog>=25.3",
    # LlamaIndex core + workflows
    "llama-index>=0.14",
    "llama-index-workflows>=2.15",
    # LlamaIndex integrations
    "llama-index-llms-openai-like>=0.4",
    "llama-index-embeddings-google-genai>=0.5",
    "llama-index-vector-stores-vertexaivectorsearch[v2]>=0.4",
    # PDF parsing
    "llama-parse>=0.6",
    "pymupdf>=1.25",
    # GCP
    "google-cloud-storage>=2.19",
    "google-cloud-aiplatform>=1.90",
    # Neo4j
    "neo4j>=5.28",
    # Entity resolution
    "rapidfuzz>=3.12",
    # HTTP client (used by integrations + tests)
    "httpx>=0.28",
    # YAML loading
    "pyyaml>=6.0",
    "llama-index-llms-google-genai>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
