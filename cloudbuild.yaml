substitutions:
  _REGION: europe-west1
  _REPO: shipper
  _BACKEND_SERVICE: shipper-backend
  _FRONTEND_SERVICE: shipper-frontend
  _LLM_PROVIDER: gemini
  _GEMINI_LLM_MODEL: gemini-2.5-flash
  _GCP_REGION: us-central1
  _VERTEX_AI_VS_COLLECTION: dora-analyst-docs
  _GCS_BUCKET_CONTRAT: regagent-documents-eu
  _GCS_BUCKET_DORA: regagent-dora-2026_cloudbuild
  _GCS_DORA_OBJECT: regulation_dora.pdf
  _NEO4J_URI: bolt://localhost:7687
  _NEO4J_USER: neo4j
  _NEO4J_PASSWORD: password123
  _GEMINI_API_KEY: ""

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: ensure-artifact-repo
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud artifacts repositories describe "${_REPO}" --location "${_REGION}" >/dev/null 2>&1 || \
        gcloud artifacts repositories create "${_REPO}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="RegAgent container images"

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID",
        "."
      ]

  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID"
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-backend
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud run deploy "${_BACKEND_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "LLM_PROVIDER=${_LLM_PROVIDER},GEMINI_LLM_MODEL=${_GEMINI_LLM_MODEL},GEMINI_API_KEY=${_GEMINI_API_KEY},GCP_PROJECT=$PROJECT_ID,GCP_REGION=${_GCP_REGION},VERTEX_AI_VS_COLLECTION=${_VERTEX_AI_VS_COLLECTION},GCS_BUCKET_CONTRAT=${_GCS_BUCKET_CONTRAT},GCS_BUCKET_DORA=${_GCS_BUCKET_DORA},GCS_DORA_OBJECT=${_GCS_DORA_OBJECT},NEO4J_URI=${_NEO4J_URI},NEO4J_USER=${_NEO4J_USER},NEO4J_PASSWORD=${_NEO4J_PASSWORD}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: resolve-backend-url
    entrypoint: bash
    args:
      - -lc
      - |
        BACKEND_URL=$(gcloud run services describe "${_BACKEND_SERVICE}" --region "${_REGION}" --format='value(status.url)')
        echo "BACKEND_URL=$$BACKEND_URL" > /workspace/backend_url.env

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -lc
      - |
        source /workspace/backend_url.env
        docker build \
          --build-arg BACKEND_API_BASE="$$BACKEND_URL" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID" \
          ./frontend

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID"
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-frontend
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud run deploy "${_FRONTEND_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID"
